name: Update most visited cases

on:
  schedule:
    - cron: "15 9 * * *"   # every day at 9:15 UTC (4:15 a.m. Eastern)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: update-popular
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recount page views and pick the top five
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: 843c245a4dffca70b59accbf11dd8f23
          CF_SITE_TAG: 7f71b6619c084905acabde87ed594bae
        run: python3 .github/scripts/update_popular.py

      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/popular.js .github/data/daily-pageviews.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Update most visited cases (nightly)"
          git pull --rebase origin main
          git push origin HEAD:main
          # Pushes made by this workflow do not always start a Pages build on their own, so ask for one.
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
